<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<title>ASCII Mirror</title>
<style>
  /* Layout: full-bleed phosphor screen, one floating control strip at the bottom */
  :root {
    --bg: #07090a;
    --panel: rgba(16, 20, 19, 0.82);
    --line: #22302b;
    --fg: #cfe9dd;
    --dim: #6f8a7f;
    --accent: #7dffb2;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 var(--mono); overflow: hidden; overscroll-behavior: none; }
  canvas#screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
    max-width: calc(100% - 32px);
    padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); transition: opacity 150ms cubic-bezier(0.23, 1, 0.32, 1); /* shows fast */
  }
  .bar.idle { opacity: 0; transition: opacity 600ms ease; pointer-events: none; } /* hides slowly; can't be tapped while invisible */
  .bar.idle:focus-within { opacity: 1; transition-duration: 150ms; pointer-events: auto; }
  label { display: flex; gap: 6px; align-items: center; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
  select, button, input[type=range] { font: inherit; color: var(--fg); }
  select, button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { button:hover, select:hover { border-color: var(--accent); color: var(--accent); } }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=range] { accent-color: var(--accent); width: 90px; }
  .status { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); padding: 4px 8px; border-radius: 6px; background: var(--panel); color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
  .status b { color: var(--accent); font-weight: normal; }
  .toast { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); color: var(--accent); font-size: 12px; opacity: 0; transform: translateY(-6px); transition: opacity 400ms ease, transform 400ms ease; }
  .toast.show { opacity: 1; transform: none; }
  .status.rec { color: #ff5a4a; }
  .status.rec b { color: #ff5a4a; }
  button#rec { border-color: #ff5a4a; color: #ff8a7d; }
  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); background: #0d1110; color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 18px; overscroll-behavior: contain; }
  dialog::backdrop { background: rgb(0 0 0 / .65); overflow: hidden; overscroll-behavior: contain; }
  dialog h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: normal; }
  dialog img { display: block; width: 100%; height: auto; border-radius: 6px; background: #000; image-rendering: auto; }
  dialog .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  dialog p { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  dialog code { color: var(--fg); }
  @media (prefers-reduced-motion: reduce) { .toast { transform: none; transition: opacity 400ms ease; } }

  /* Touch baseline: no tap flash, no double-tap delay, press feedback, no iOS input zoom */
  html { -webkit-tap-highlight-color: transparent; }
  button, a, .btn, summary { touch-action: manipulation; }
  button, .btn, summary { -webkit-user-select: none; user-select: none; }
  button, .btn { transition: transform 160ms cubic-bezier(.23, 1, .32, 1); }
  button:active, .btn:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
    button, .btn { min-block-size: 44px; }
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="status" id="status">ASCII Mirror · <b id="src">starting camera…</b> · <span id="fps"></span></div>
<div class="toast" id="toast"></div>

<div class="bar" id="bar">
  <label for="charset">Glyphs
    <select id="charset">
      <option value=" .:-=+*#%@">Classic</option>
      <option value=" ░▒▓█">Blocks</option>
      <option value=" .'`^,:;Il!i><~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Dense</option>
      <option value=" 01">Binary</option>
      <option value=" ·•●">Dots</option>
      <option value=" ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ">Rain</option>
    </select>
  </label>
  <label for="color">Color
    <select id="color">
      <option value="phosphor">Phosphor</option>
      <option value="amber">Amber</option>
      <option value="true">True color</option>
      <option value="heat">Heat</option>
      <option value="paper">Paper</option>
    </select>
  </label>
  <label for="size">Cell <input id="size" type="range" min="6" max="28" value="12"></label>
  <label for="contrast">Contrast <input id="contrast" type="range" min="50" max="250" value="130"></label>
  <label for="glow">Glow <input id="glow" type="range" min="0" max="100" value="45"></label>
  <button id="invert" aria-pressed="false" title="Invert (I)">Invert</button>
  <button id="flip" aria-pressed="true" title="Mirror (M)">Mirror</button>
  <button id="freeze" aria-pressed="false" title="Freeze (Space)">Freeze</button>
  <button id="snap" title="Save PNG (S)">Save PNG</button>
  <button id="copy" title="Copy as text (C)">Copy text</button>
  <button id="rec" title="Record 5 seconds (R)">Record</button>
</div>

<dialog id="clip" closedby="any" aria-labelledby="clipTitle">
  <h2 id="clipTitle">Your 5-second clip</h2>
  <img id="clipGif" alt="The recorded clip as a looping GIF">
  <div class="row">
    <button id="dlGif">GIF</button>
    <button id="dlVideo">Video</button>
    <button id="dlSh">Terminal</button>
    <span style="flex:1"></span>
    <button id="clipClose">Close</button>
  </div>
  <p id="clipInfo"></p>
  <p>Terminal: run <code>sh ascii-clip.sh</code> in any terminal 80 columns wide; Ctrl-C stops it.</p>
</dialog>

<script>
const $ = id => document.getElementById(id);
const screen = $('screen'), ctx = screen.getContext('2d');
const glowCv = document.createElement('canvas'), gctx = glowCv.getContext('2d');
const sample = document.createElement('canvas'), sctx = sample.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video');
video.playsInline = true; video.muted = true;

const state = { cols: 0, rows: 0, cw: 0, ch: 0, frozen: false, invert: false, flip: true, live: false, lastText: '' };
const PALETTES = {
  phosphor: { bg: '#07090a', f: v => `hsl(145 100% ${12 + v * 68}%)` },
  amber:    { bg: '#0b0703', f: v => `hsl(36 100% ${10 + v * 60}%)` },
  heat:     { bg: '#05030a', f: v => `hsl(${260 - v * 220} 95% ${15 + v * 50}%)` },
  paper:    { bg: '#efeae0', f: v => `hsl(220 25% ${88 - v * 80}%)`, paper: true },
};

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  screen.width = innerWidth * dpr; screen.height = innerHeight * dpr;
  glowCv.width = screen.width / 2; glowCv.height = screen.height / 2;
  const size = +$('size').value * dpr;
  state.ch = size; state.cw = size * 0.62;
  state.cols = Math.floor(screen.width / state.cw);
  state.rows = Math.floor(screen.height / state.ch);
  sample.width = state.cols; sample.height = state.rows;
}

// Fallback source when no camera: drifting interference pattern, so the screen is never empty.
function drawDemo(t) {
  const { cols, rows } = state, img = sctx.createImageData(cols, rows), d = img.data;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const nx = x / cols - .5, ny = (y / rows - .5) * rows / cols * 1.6;
    const r = Math.hypot(nx, ny);
    const v = .5 + .5 * Math.sin(r * 28 - t * 2.2) * Math.cos(nx * 9 + t * .7) + .25 * Math.sin(ny * 14 - t);
    const c = Math.max(0, Math.min(255, v * 200)), i = (y * cols + x) * 4;
    d[i] = c * (.6 + .4 * Math.sin(t + nx * 4)); d[i + 1] = c; d[i + 2] = c * (.7 + .3 * Math.cos(t * .8)); d[i + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);
}

function grab(t) {
  if (!state.live) return drawDemo(t / 1000);
  const { cols, rows } = state;
  // cover-fit the video into the sample grid, correcting for the cell aspect
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const target = (cols * state.cw) / (rows * state.ch), src = vw / vh;
  let sw = vw, sh = vh, sx = 0, sy = 0;
  if (src > target) { sw = vh * target; sx = (vw - sw) / 2; } else { sh = vw / target; sy = (vh - sh) / 2; }
  sctx.save();
  if (state.flip) { sctx.translate(cols, 0); sctx.scale(-1, 1); }
  sctx.drawImage(video, sx, sy, sw, sh, 0, 0, cols, rows);
  sctx.restore();
}

function render() {
  const { cols, rows, cw, ch } = state;
  const glyphs = [...$('charset').value], n = glyphs.length - 1;
  const mode = $('color').value, pal = PALETTES[mode] || PALETTES.phosphor;
  const k = +$('contrast').value / 100;
  const data = sctx.getImageData(0, 0, cols, rows).data;
  const bg = mode === 'true' ? '#050505' : pal.bg;
  document.body.style.background = bg;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, screen.width, screen.height);
  ctx.font = `${ch * 0.92}px ${getComputedStyle(document.body).getPropertyValue('--mono')}`;
  ctx.textBaseline = 'top';
  const lines = [];
  let lastFill = '';
  for (let y = 0; y < rows; y++) {
    let line = '';
    for (let x = 0; x < cols; x++) {
      const i = (y * cols + x) * 4, r = data[i], g = data[i + 1], b = data[i + 2];
      let v = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      v = Math.max(0, Math.min(1, (v - .5) * k + .5));
      if (state.invert) v = 1 - v;
      if (pal.paper) v = v; // paper palette already darkens with v
      const gi = Math.round(v * n), chr = glyphs[gi];
      line += chr;
      if (gi === 0) continue;
      let fill;
      if (mode === 'true') {
        const q = c => (c >> 4) << 4; // quantize to cut fillStyle churn
        fill = state.invert ? `rgb(${255 - q(r)},${255 - q(g)},${255 - q(b)})` : `rgb(${q(r)},${q(g)},${q(b)})`;
      } else fill = pal.f(Math.round(v * 12) / 12);
      if (fill !== lastFill) { ctx.fillStyle = fill; lastFill = fill; }
      ctx.fillText(chr, x * cw, y * ch);
    }
    lines.push(line.replace(/\s+$/, ''));
  }
  state.lastText = lines.join('\n');

  const glow = +$('glow').value / 100;
  if (glow > 0 && !pal.paper) {
    gctx.clearRect(0, 0, glowCv.width, glowCv.height);
    gctx.filter = `blur(${4 + glow * 10}px)`;
    gctx.drawImage(screen, 0, 0, glowCv.width, glowCv.height);
    gctx.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = glow;
    ctx.drawImage(glowCv, 0, 0, screen.width, screen.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

let frames = 0, fpsT = performance.now();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let running = false;
function start() { if (running) return; running = true; frames = 0; fpsT = performance.now(); requestAnimationFrame(loop); }
function loop(t) {
  if (state.frozen) { running = false; return; } // a frozen frame doesn't change; Freeze restarts the loop
  grab(reduceMotion.matches && !state.live ? 0 : t); render();
  if (rec) capture(t);
  frames++;
  if (t - fpsT > 1000) { $('fps').textContent = `${frames} fps · ${state.cols}×${state.rows}`; frames = 0; fpsT = t; }
  requestAnimationFrame(loop);
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    state.live = true; $('src').textContent = 'camera live';
  } catch (e) {
    $('src').textContent = 'no camera access, showing demo pattern';
    console.warn(e);
  }
}

function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1600); }
function toggle(id, key) { state[key] = !state[key]; $(id).setAttribute('aria-pressed', state[key]); }

$('invert').onclick = () => toggle('invert', 'invert');
$('flip').onclick = () => toggle('flip', 'flip');
$('freeze').onclick = () => { toggle('freeze', 'frozen'); start(); };
$('size').oninput = resize;
$('snap').onclick = () => {
  const a = document.createElement('a');
  a.download = `ascii-mirror-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
  a.href = screen.toDataURL('image/png'); a.click(); toast('Saved PNG');
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(state.lastText); toast('Copied frame as text'); }
  catch { toast('Copy failed: clipboard blocked'); }
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { ' ': 'freeze', i: 'invert', m: 'flip', s: 'snap', c: 'copy', r: 'rec' };
  const id = map[e.key.toLowerCase()]; if (id) { e.preventDefault(); $(id).click(); }
});
// Any pointer activity shows the bar; a tap often fires no pointermove, so pointerdown counts too.
// It stays up while the pointer rests on it.
let idleT;
const wake = () => { const bar = $('bar'); bar.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function hide() { if (bar.matches(':hover')) idleT = setTimeout(hide, 3000); else bar.classList.add('idle'); }, 3000); };
addEventListener('pointermove', wake); addEventListener('pointerdown', wake);
addEventListener('resize', resize);

/* ---------- Recording: one 5-second take, saved as GIF, video and a terminal script ---------- */
const REC_MS = 5000, GIF_FPS = 12.5, TERM_COLS = 80;
let rec = null, lastClip = null;
function startRecording() {
  if (rec) return;
  if (state.frozen) { toggle('freeze', 'frozen'); start(); }
  rec = { t0: null, next: 0, gif: [], term: [], gw: 0, gh: 0, chunks: [], recorder: null, mime: '' };
  // Video straight from the canvas, if the browser can record it
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  rec.mime = (window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t))) || '';
  if (rec.mime && screen.captureStream) {
    try {
      rec.recorder = new MediaRecorder(screen.captureStream(30), { mimeType: rec.mime, videoBitsPerSecond: 6e6 });
      const chunks = rec.chunks; // the last chunk arrives after rec is cleared, so keep our own reference
      rec.recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.recorder.start();
    } catch { rec.recorder = null; }
  }
  $('status').classList.add('rec'); $('rec').disabled = true;
}
function capture(t) {
  if (rec.t0 === null) rec.t0 = t;
  const el = t - rec.t0;
  $('src').textContent = `● rec ${(Math.max(0, REC_MS - el) / 1000).toFixed(1)}s`;
  if (el >= rec.next) {
    rec.next += 1000 / GIF_FPS;
    // GIF frame: the screen scaled to 480 px wide
    const gw = Math.min(480, screen.width), gh = Math.round(gw * screen.height / screen.width);
    const c = capture.c ||= document.createElement('canvas'), cx = capture.x ||= c.getContext('2d', { willReadFrequently: true });
    if (c.width !== gw || c.height !== gh) { c.width = gw; c.height = gh; }
    cx.drawImage(screen, 0, 0, gw, gh); rec.gw = gw; rec.gh = gh;
    rec.gif.push(cx.getImageData(0, 0, gw, gh).data);
    rec.term.push(terminalFrame());
  }
  if (el >= REC_MS) finishRecording();
}
// The same picture as text, at a terminal's 80 columns (terminal cells are about twice as tall as wide)
function terminalFrame() {
  const { cols, rows, cw, ch } = state, aspect = (cols * cw) / (rows * ch);
  const tc = TERM_COLS, tr = Math.max(8, Math.round(tc * .5 / aspect));
  const c = terminalFrame.c ||= document.createElement('canvas'), x = terminalFrame.x ||= c.getContext('2d', { willReadFrequently: true });
  c.width = tc; c.height = tr; x.drawImage(sample, 0, 0, tc, tr);
  const d = x.getImageData(0, 0, tc, tr).data, glyphs = [...$('charset').value], n = glyphs.length - 1, k = +$('contrast').value / 100;
  const lines = [];
  for (let y = 0; y < tr; y++) {
    let line = '';
    for (let i = 0; i < tc; i++) {
      const o = (y * tc + i) * 4; let v = (0.2126 * d[o] + 0.7152 * d[o + 1] + 0.0722 * d[o + 2]) / 255;
      v = Math.max(0, Math.min(1, (v - .5) * k + .5)); if (state.invert) v = 1 - v;
      line += glyphs[Math.round(v * n)];
    }
    lines.push(line);
  }
  return lines.join('\n');
}
async function finishRecording() {
  const r = rec; rec = null;
  $('status').classList.remove('rec'); $('src').textContent = state.live ? 'camera live' : 'no camera access, showing demo pattern';
  $('rec').disabled = false;
  let video = null;
  if (r.recorder) {
    await new Promise(res => { r.recorder.onstop = res; r.recorder.stop(); });
    video = new Blob(r.chunks, { type: r.mime.split(';')[0] });
  }
  toast('Encoding…');
  await new Promise(res => setTimeout(res, 30)); // let the toast paint
  const gif = encodeGif(r.gif, r.gw, r.gh, Math.round(100 / GIF_FPS));
  const sh = terminalScript(r.term, 1 / GIF_FPS);
  if (lastClip) URL.revokeObjectURL(lastClip.gifUrl);
  lastClip = { gif, video, sh, gifUrl: URL.createObjectURL(gif), frames: r.gif.length };
  $('clipGif').src = lastClip.gifUrl;
  $('dlVideo').hidden = !video;
  const kb = b => `${Math.round(b.size / 1024)} KB`;
  $('clipInfo').textContent = `${r.gif.length} frames · GIF ${kb(gif)}${video ? ` · video ${kb(video)}` : ' · video not supported in this browser'} · terminal ${kb(sh)}`;
  $('clip').showModal();
}
function terminalScript(frames, delay) {
  const out = ['#!/bin/sh', '# ASCII Mirror clip. Run: sh ascii-clip.sh   (Ctrl-C to stop)', "printf '\\033[?25l\\033[2J'", "trap \"printf '\\033[?25h\\n'; exit\" INT TERM", 'while :; do'];
  for (const f of frames) out.push("printf '\\033[H'", "cat <<'ASCII_FRAME_END'", f, 'ASCII_FRAME_END', `sleep ${delay.toFixed(2)}`);
  out.push('done', '');
  return new Blob([out.join('\n')], { type: 'text/x-shellscript' });
}

// Minimal animated GIF encoder: one shared 256-colour palette (the clip's most common colours), LZW-compressed frames, looping
function encodeGif(frames, w, h, delayCs) {
  const key = (r, g, b) => (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
  const hist = new Uint32Array(32768);
  for (const f of frames) for (let i = 0; i < f.length; i += 16) hist[key(f[i], f[i + 1], f[i + 2])]++;
  const top = [...hist.keys()].filter(k => hist[k]).sort((a, b) => hist[b] - hist[a]).slice(0, 256);
  const pal = top.map(k => [((k >> 10) & 31) << 3 | 4, ((k >> 5) & 31) << 3 | 4, (k & 31) << 3 | 4]);
  while (pal.length < 256) pal.push([0, 0, 0]);
  const near = new Int16Array(32768).fill(-1);
  const index = k => {
    if (near[k] >= 0) return near[k];
    const r = ((k >> 10) & 31) << 3, g = ((k >> 5) & 31) << 3, b = (k & 31) << 3; let bi = 0, bd = Infinity;
    for (let i = 0; i < top.length; i++) { const p = pal[i], d = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2; if (d < bd) { bd = d; bi = i; } }
    return near[k] = bi;
  };
  const bytes = []; const put = (...a) => bytes.push(...a); const word = v => put(v & 255, v >> 8);
  put(...'GIF89a'.split('').map(c => c.charCodeAt(0))); word(w); word(h); put(0xF7, 0, 0);
  for (const [r, g, b] of pal) put(r, g, b);
  put(0x21, 0xFF, 11, ...'NETSCAPE2.0'.split('').map(c => c.charCodeAt(0)), 3, 1, 0, 0, 0); // loop forever
  for (const f of frames) {
    put(0x21, 0xF9, 4, 0, delayCs & 255, delayCs >> 8, 0, 0);
    put(0x2C); word(0); word(0); word(w); word(h); put(0);
    const px = new Uint8Array(w * h);
    for (let i = 0, j = 0; j < px.length; i += 4, j++) px[j] = index(key(f[i], f[i + 1], f[i + 2]));
    put(8); const data = lzw(px, 8);
    for (let i = 0; i < data.length; i += 255) { const n = Math.min(255, data.length - i); put(n); for (let k = 0; k < n; k++) bytes.push(data[i + k]); }
    put(0);
  }
  put(0x3B);
  return new Blob([new Uint8Array(bytes)], { type: 'image/gif' });
}
function lzw(px, minSize) {
  const clear = 1 << minSize, eoi = clear + 1, out = []; let size = minSize + 1, next = eoi + 1, cur = 0, bits = 0;
