<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e6df">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151514">
<title>Brick Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: instructions column (steps, parts) on the left, the isometric model on the right; stacks on narrow screens */
  :root { --bg: #e9e6df; --fg: #111; --dim: #6b6862; --line: #111; --acc: #ff3b1f; --field: #f4f2ed;
          --display: "Anton", Impact, sans-serif; --mono: "Space Mono", ui-monospace, Menlo, monospace; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #f2f0eb; --dim: #8d8a83; --line: #f2f0eb; --field: #1e1e1c; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px max(16px, 3vw) 64px; display: grid; gap: 32px;
          grid-template-columns: minmax(0, 360px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } .stagewrap { order: -1; } }
  .back { color: var(--dim); text-decoration: none; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  @media (hover: hover) and (pointer: fine) { .back:hover { color: var(--acc); } }
  h1 { font: 400 clamp(52px, 7vw, 92px)/.85 var(--display); text-transform: uppercase; margin: 14px 0 12px; }
  h1 span { color: var(--acc); }
  .lede { color: var(--dim); margin: 0 0 20px; }
  h2 { font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin: 22px 0 8px; display: flex; justify-content: space-between; }
  h2 span { color: var(--dim); font-weight: 400; }
  .row { display: flex; gap: 8px; align-items: center; }
  select { flex: 1; min-width: 0; font: 14px var(--mono); color: var(--fg); background: var(--field); border: 2px solid var(--line); padding: 8px 10px; border-radius: 0; }
  input[type=range] { flex: 1; accent-color: var(--acc); min-width: 0; }
  button, a.btn { font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: none;
           border: 2px solid var(--line); padding: 8px 12px; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { button:hover, a.btn:hover { background: var(--fg); color: var(--bg); } }
  a.btn { text-decoration: none; display: inline-block; }
  button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  .stepno { font: 400 44px/1 var(--display); min-width: 3ch; text-align: center; }
  .stepno small { font: 13px var(--mono); color: var(--dim); }
  ul.parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  ul.parts li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
  .sw { width: 22px; height: 14px; border: 1px solid rgb(0 0 0 / .35); }
  .qty { font-weight: 700; }
  .note { color: var(--dim); font-size: 12px; }
  details { border-top: 2px solid var(--line); margin-top: 22px; padding-top: 4px; }
  summary { cursor: pointer; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 8px 0; }
  .stagewrap { position: sticky; top: 16px; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; border: 3px solid var(--line); background: var(--field); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .tools .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  @media (hover: none) { .tools .hint { display: none; } } /* keyboard shortcuts, useless on touch */

  /* Touch baseline: no tap flash, no double-tap delay, press feedback, no iOS input zoom */
  html { -webkit-tap-highlight-color: transparent; }
  button, a, .btn, summary { touch-action: manipulation; }
  button, .btn, summary { -webkit-user-select: none; user-select: none; }
  button, .btn { transition: transform 160ms cubic-bezier(.23, 1, .32, 1); }
  button:active, .btn:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
    button, .btn { min-block-size: 44px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <a class="back" href="../">← Creative Lab</a>
    <h1>Brick<br>Room<span>.</span></h1>
    <p class="lede">Rooms designed as buildable brick models, with step-by-step instructions and a parts list. Describe a room to Claude and it adds a new model here.</p>

    <div class="row"><select id="model" aria-label="Model"></select></div>
    <p class="note" id="mnote"></p>

    <h2>Step <span id="steptotal"></span></h2>
    <div class="row">
      <button type="button" id="prev" aria-label="Previous step">←</button>
      <div class="stepno" id="stepno" aria-live="polite"></div>
      <button type="button" id="next" aria-label="Next step">→</button>
      <input type="range" id="step" min="1" value="1" aria-label="Step">
    </div>
    <div class="row" style="margin-top:8px"><button type="button" id="all" aria-pressed="false">Show finished model</button></div>

    <h2>This step <span id="stepcount"></span></h2>
    <ul class="parts" id="stepparts"></ul>

    <details>
      <summary>Full parts list <span id="totalcount"></span></summary>
      <ul class="parts" id="allparts"></ul>
      <div class="row" style="margin-top:12px"><button type="button" id="copy">Copy list</button></div>
    </details>
  </div>

  <div class="stagewrap">
    <canvas id="c" role="img" aria-label="Brick model"></canvas>
    <div class="tools">
      <button type="button" id="rl" aria-label="Turn left">⟲</button>
      <button type="button" id="rr" aria-label="Turn right">⟳</button>
      <button type="button" id="png">Save PNG</button>
      <a class="btn" id="booklet" href="booklet.html">Booklet &amp; parts order</a>
      <span class="hint">← → steps · [ ] turn</span>
    </div>
  </div>
</main>

<script src="models.js"></script>
<script src="render.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const state = { m: 0, step: 1, all: false, view: 0 };
let steps = []; // distinct starting heights (plates), one build step each

function draw(c = ctx, px = cv.width) {
  drawModel(c, px, MODELS[state.m], { view: state.view, all: state.all, zStep: steps[state.step - 1],
    bg: getComputedStyle(document.body).getPropertyValue('--field') || '#f4f2ed' });
}

function renderParts(ul, list) {
  ul.replaceChildren(...partsList(list).map(({ b, n }) => {
    const li = document.createElement('li');
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = COLORS[b.c][1];
    const name = document.createElement('span'); name.textContent = `${COLORS[b.c][0]} ${partName(b)}`;
    const q = document.createElement('span'); q.className = 'qty'; q.textContent = `×${n}`;
    li.append(sw, name, q); return li;
  }));
}

function update() {
  const m = MODELS[state.m];
  $('stepno').innerHTML = state.all ? '✓' : `${state.step}`;
  $('step').value = state.step;
  $('steptotal').textContent = `of ${steps.length}`;
  $('all').setAttribute('aria-pressed', String(state.all));
  $('prev').disabled = !state.all && state.step === 1;
  $('next').disabled = !state.all && state.step === steps.length;
  const now = state.all ? m.bricks : m.bricks.filter(b => b.z === steps[state.step - 1]);
  $('stepcount').textContent = `${now.length} parts`;
  renderParts($('stepparts'), now);
  cv.setAttribute('aria-label', state.all ? `${m.name}, finished model, ${m.bricks.length} parts`
    : `${m.name}, step ${state.step} of ${steps.length}: adds ${now.length} parts`);
  draw();
}
function loadModel(i) {
  state.m = i; const m = MODELS[i];
  $('booklet').href = `booklet.html#m=${i}`;
  steps = buildSteps(m);
  state.step = 1; state.all = true;
  $('step').max = steps.length;
  $('mnote').textContent = `${m.note} Build it on a ${m.base || '32 × 32'} baseplate (not in the list).`;
  $('totalcount').textContent = `· ${m.bricks.length} parts`;
  renderParts($('allparts'), m.bricks);
  update();
}

MODELS.forEach((m, i) => $('model').add(new Option(m.name, i)));
$('model').onchange = e => loadModel(+e.target.value);
const go = n => { state.all = false; state.step = Math.min(steps.length, Math.max(1, n)); update(); };
$('prev').onclick = () => go(state.all ? steps.length : state.step - 1);
$('next').onclick = () => go(state.all ? 1 : state.step + 1);
$('step').oninput = e => go(+e.target.value);
$('all').onclick = () => { state.all = !state.all; update(); };
const turn = d => { state.view = (state.view + d + 4) % 4; draw(); };
$('rl').onclick = () => turn(-1); $('rr').onclick = () => turn(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('select, input')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') go(state.all ? 1 : state.step + 1);
  if (e.key === 'ArrowLeft') go(state.all ? steps.length : state.step - 1);
  if (e.key === '[') turn(-1);
  if (e.key === ']') turn(1);
});
let copyT;
$('copy').onclick = async e => {
  const text = partsList(MODELS[state.m].bricks).map(({ b, n }) => `${n}\t${COLORS[b.c][0]}\t${partName(b)}`).join('\n');
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; } catch { b.textContent = 'Copy failed'; }
  clearTimeout(copyT); copyT = setTimeout(() => (b.textContent = 'Copy list'), 2000);
};
$('png').onclick = () => {
  const out = document.createElement('canvas'); out.width = out.height = 2000;
  draw(out.getContext('2d'), 2000);
  out.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `${MODELS[state.m].name.toLowerCase().replace(/\W+/g, '-')}${state.all ? '' : '-step-' + state.step}.png`; a.click(); });
};

const dpr = Math.min(2, devicePixelRatio || 1); cv.width = cv.height = Math.round(1000 * dpr);
loadModel(0);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());
</script>
</body>
</html>
