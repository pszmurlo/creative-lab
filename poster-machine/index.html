<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e6df">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151514">
<title>Poster Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: print-shop wall. Toolbar on top, posters pinned in a dense grid, one lightbox for the close-up */
  :root {
    --bg: #e9e6df;
    --fg: #111111;
    --dim: #57544f;
    --line: #111111;
    --accent: #ff3b1f;
    --card: #f6f4ef;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --display: "Anton", Impact, "Arial Narrow", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #f2f0eb; --dim: #8d8a83; --line: #f2f0eb; --card: #1f1f1d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--mono); }
  header {
    display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: end; justify-content: space-between;
    padding: 28px max(16px, 3vw) 20px; border-bottom: 3px solid var(--line);
  }
  h1 { margin: 0; font: 400 clamp(48px, 9vw, 112px)/.85 var(--display); text-transform: uppercase; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .sub { margin: 8px 0 0; color: var(--dim); max-width: 46ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  select, input[type=text], button {
    font: 700 12px var(--mono); color: var(--fg); background: var(--card);
    border: 2px solid var(--line); border-radius: 0; padding: 8px 10px;
  }
  input[type=text] { width: min(320px, 70vw); font-weight: 400; }
  button { cursor: pointer; text-transform: uppercase; letter-spacing: .06em; }
  @media (hover: hover) and (pointer: fine) { button:hover { background: var(--fg); color: var(--bg); } }
  button.primary { background: var(--accent); color: #111; border-color: var(--line); }
  @media (hover: hover) and (pointer: fine) { button.primary:hover { background: var(--fg); color: var(--bg); } }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { padding: 24px max(16px, 3vw) 64px; }
  .count { margin: 0 0 16px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .wall figure { margin: 0; cursor: zoom-in; }
  .wall canvas { width: 100%; height: auto; display: block; box-shadow: 0 1px 0 rgba(0,0,0,.15), 4px 6px 0 rgba(0,0,0,.12); transition: transform .15s; }
  @media (hover: hover) and (pointer: fine) { .wall figure:hover canvas { transform: translateY(-3px) rotate(-.4deg); } }
  .wall figcaption { margin-top: 6px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  dialog { border: 3px solid var(--line); padding: 0; background: var(--bg); color: var(--fg); max-width: min(1100px, 96vw); width: 100%; overscroll-behavior: contain; }
  dialog::backdrop { background: rgba(10,10,10,.75); overflow: hidden; overscroll-behavior: contain; }
  /* Dialog enter/exit: fade in 200ms, out 150ms; the slight scale is skipped under reduced motion */
  dialog, dialog::backdrop { transition: opacity 200ms cubic-bezier(.23, 1, .32, 1), overlay 200ms allow-discrete, display 200ms allow-discrete; }
  dialog:not([open]), dialog:not([open])::backdrop { opacity: 0; transition-duration: 150ms; }
  @starting-style { dialog[open], dialog[open]::backdrop { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    dialog { transition: opacity 200ms cubic-bezier(.23, 1, .32, 1), scale 200ms cubic-bezier(.23, 1, .32, 1), overlay 200ms allow-discrete, display 200ms allow-discrete; }
    dialog:not([open]) { scale: .96; }
    @starting-style { dialog[open] { scale: .96; } }
  }
  .lb { display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
  .lb canvas { width: 100%; height: auto; display: block; max-height: 86svh; object-fit: contain; background: #000; }
  .lb aside { padding: 20px; display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--line); }
  .lb aside h2 { margin: 0 0 6px; font: inherit; color: var(--dim); }
  .lb aside p { margin: 0 0 6px; color: var(--dim); }
  .lb aside a { color: var(--fg); }
  @media (max-width: 720px) { .lb { grid-template-columns: 1fr; } .lb aside { border-left: 0; border-top: 3px solid var(--line); } }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translate(-50%, 8px); background: var(--fg); color: var(--bg); padding: 8px 14px; font-weight: 700; opacity: 0; transition: opacity 400ms ease, transform 400ms ease; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .wall canvas { transition: none; } .toast { transform: translateX(-50%); transition: opacity 400ms ease; } .toast.show { transform: translateX(-50%); } }

  /* Touch baseline: no tap flash, no double-tap delay, press feedback, no iOS input zoom */
  html { -webkit-tap-highlight-color: transparent; }
  button, a, .btn, summary { touch-action: manipulation; }
  button, .btn, summary { -webkit-user-select: none; user-select: none; }
  button, .btn { transition: transform 160ms cubic-bezier(.23, 1, .32, 1); }
  button:active, .btn:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
    button, .btn { min-block-size: 44px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Poster<br>Machine<span>.</span></h1>
    <p class="sub">Your X bookmarks, reprinted as brutalist posters. Click one to rework it or save it as a PNG.</p>
  </div>
  <div class="controls">
    <label class="field"><span>Layout</span>
      <select id="layout">
        <option value="auto">Auto</option>
        <option value="shout">Shout</option>
        <option value="stack">Stack</option>
        <option value="numbers">Numbers</option>
        <option value="grid">Grid</option>
        <option value="ticker">Ticker</option>
      </select>
    </label>
    <label class="field"><span>Ink</span>
      <select id="palette">
        <option value="auto">Auto</option>
      </select>
    </label>
    <button id="reroll" title="Shuffle every poster (R)">Reroll all</button>
    <form id="own" class="controls">
      <label class="field"><span>Your own words</span>
        <input id="ownText" type="text" placeholder="Type a line, get a poster" maxlength="280">
      </label>
      <button class="primary" type="submit">Print it</button>
    </form>
  </div>
</header>

<main>
  <p class="count" id="count"></p>
  <div class="wall" id="wall"></div>
</main>

<dialog id="lightbox" aria-labelledby="lbMeta">
  <div class="lb">
    <canvas id="big" width="1000" height="1414"></canvas>
    <aside>
      <h2 id="lbMeta"></h2>
      <button type="button" id="lbLayout" title="Next layout (L)">Next layout</button>
      <button type="button" id="lbInk" title="Next ink (P)">Next ink</button>
      <button type="button" id="lbReroll" title="Reroll (R)">Reroll</button>
      <button type="button" class="primary" id="lbSave" title="Save PNG (S)">Save PNG</button>
      <p><a id="lbLink" href="#" target="_blank" rel="noopener">Open the post on X</a></p>
      <button type="button" id="lbClose">Close</button>
    </aside>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script src="bookmarks.js"></script>
<script src="posters.js"></script>
<script>
let globalSeed = 1;
const items = (window.BOOKMARKS || []).map(b => ({ ...b, seed: 0, layout: null, ink: null }));
const opts = () => ({ layout: document.getElementById('layout').value, ink: document.getElementById('palette').value, seed: globalSeed, total: items.length });
const render = (canvas, item, idx, scale) => renderPoster(canvas, item, idx, scale, opts());

// ---------- wall ----------
const wall = document.getElementById('wall');
function renderWall() {
  wall.textContent = '';
  const dpr = Math.min(devicePixelRatio || 1, 2);
  items.forEach((item, i) => {
    const fig = document.createElement('figure'); fig.tabIndex = 0; fig.role = 'button';
    const cv = document.createElement('canvas');
    const px = 320 * dpr; cv.width = px; cv.height = Math.round(px * H / W);
    const c = render(cv, item, i, px / W);
    cv.setAttribute('aria-label', `Poster of a post by ${item.name}: ${clean(item.text)}`);
    const cap = document.createElement('figcaption'); cap.textContent = `${c.layout} · ${c.inkName} · @${item.handle}`;
    fig.append(cv, cap);
    fig.onclick = () => openLb(i);
    fig.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); } };
    wall.append(fig);
  });
  document.getElementById('count').textContent = `${items.length} posters from your bookmarks · captured ${(window.BOOKMARKS_CAPTURED || '').split('-').reverse().join('.')}`;
}

// ---------- lightbox ----------
const lb = document.getElementById('lightbox'), big = document.getElementById('big');
let current = -1;
function drawBig() {
  big.width = 1400; big.height = Math.round(1400 * H / W);
  const c = render(big, items[current], current, 1400 / W);
  const it = items[current];
  document.getElementById('lbMeta').textContent = `${it.name} (@${it.handle}) · ${c.layout} · ${c.inkName}`;
  document.getElementById('lbLink').href = it.url || '#';
  document.getElementById('lbLink').hidden = !it.url;
  return c;
}
function openLb(i) { current = i; drawBig(); lb.showModal(); }
function refreshThumb() { const fig = wall.children[current]; if (!fig) return; const cv = fig.querySelector('canvas'); const c = render(cv, items[current], current, cv.width / W); fig.querySelector('figcaption').textContent = `${c.layout} · ${c.inkName} · @${items[current].handle}`; }
function cycle(key, list) {
  const c = choose(items[current], current, opts());
  const now = key === 'layout' ? c.layout : c.inkName;
  items[current][key] = list[(list.indexOf(now) + 1) % list.length];
  drawBig(); refreshThumb();
}
document.getElementById('lbLayout').onclick = () => cycle('layout', LAYOUTS);
document.getElementById('lbInk').onclick = () => cycle('ink', Object.keys(INKS));
document.getElementById('lbReroll').onclick = () => { items[current].seed++; items[current].layout = null; items[current].ink = null; drawBig(); refreshThumb(); };
document.getElementById('lbClose').onclick = () => lb.close();
document.getElementById('lbSave').onclick = () => {
  const out = document.createElement('canvas'); out.width = 2000; out.height = Math.round(2000 * H / W);
  render(out, items[current], current, 2000 / W);
  out.toBlob(blob => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `poster-${String(current + 1).padStart(2, '0')}-${items[current].handle}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Saved PNG');
  });
};
lb.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l') document.getElementById('lbLayout').click();
  if (k === 'p') document.getElementById('lbInk').click();
  if (k === 'r') document.getElementById('lbReroll').click();
  if (k === 's') document.getElementById('lbSave').click();
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { current = (current + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length; drawBig(); }
});
lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });

// ---------- toolbar ----------
const pal = document.getElementById('palette');
Object.keys(INKS).forEach(k => pal.add(new Option(k[0].toUpperCase() + k.slice(1), k)));
document.getElementById('layout').onchange = () => { items.forEach(i => i.layout = null); renderWall(); };
pal.onchange = () => { items.forEach(i => i.ink = null); renderWall(); };
document.getElementById('reroll').onclick = () => { globalSeed++; items.forEach(i => { i.layout = null; i.ink = null; }); renderWall(); };
addEventListener('keydown', e => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (!lb.open && e.key.toLowerCase() === 'r' && !/INPUT|SELECT/.test(e.target.tagName)) document.getElementById('reroll').click(); });
document.getElementById('own').onsubmit = e => {
  e.preventDefault();
  const t = document.getElementById('ownText').value.trim(); if (!t) return;
  const d = new Date();
  items.unshift({ name: 'You', handle: 'you', date: d.toISOString().slice(0, 10), url: '', text: t, seed: 0, layout: null, ink: null });
  document.getElementById('ownText').value = '';
  renderWall(); openLb(0);
};
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1500); }

// Wait for the poster faces (max 3 s) so the first print uses the real type.
const fontsReady = Promise.all(['100px Anton', '100px "Archivo Black"', '20px "Space Mono"'].map(f => document.fonts.load(f)));
Promise.race([fontsReady, new Promise(r => setTimeout(r, 3000))]).catch(() => {}).finally(renderWall);
</script>
</body>
</html>
