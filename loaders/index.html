<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e6df">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151514">
<title>Loader a Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap">
<style>
  /* Layout: header, then a 30-slot grid (one per day); filled slots play their loader, empty ones wait */
  :root { --bg: #e9e6df; --fg: #111; --ink: #111; --dim: #6b6862; --line: #111; --acc: #ff3b1f; --tile: #f4f2ed;
          --display: "Anton", Impact, sans-serif; --mono: "Space Mono", ui-monospace, Menlo, monospace; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #f2f0eb; --ink: #f2f0eb; --dim: #8d8a83; --line: #f2f0eb; --tile: #1e1e1c; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--mono); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px max(16px, 4vw) 80px; }
  .back { color: var(--dim); text-decoration: none; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  @media (hover: hover) and (pointer: fine) { .back:hover { color: var(--acc); } }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px;
           border-bottom: 3px solid var(--line); padding-bottom: 16px; margin: 16px 0 24px; }
  h1 { font: 400 clamp(56px, 11vw, 140px)/.85 var(--display); text-transform: uppercase; margin: 0; }
  h1 span { color: var(--acc); }
  .meta { display: grid; gap: 10px; justify-items: end; text-align: right; }
  .count { font: 400 clamp(32px, 5vw, 56px)/1 var(--display); }
  .count small { font: 13px var(--mono); color: var(--dim); }
  .lede { color: var(--dim); max-width: 60ch; margin: 0 0 24px; }
  button { font: 700 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: none;
           border: 2px solid var(--line); padding: 8px 12px; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { button:hover { background: var(--fg); color: var(--bg); } }
  :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

  .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .tile { display: grid; grid-template-rows: 1fr auto; aspect-ratio: 1; width: 100%; padding: 0; text-align: left;
          background: var(--tile); border: 2px solid var(--line); text-transform: none; letter-spacing: 0; font-weight: 400; }
  @media (hover: hover) and (pointer: fine) { .tile:hover { background: var(--tile); color: var(--fg); border-color: var(--acc); } }
  @media (hover: hover) and (pointer: fine) { .tile:hover .cap b { color: var(--acc); } }
  .stage { display: grid; place-items: center; overflow: hidden; min-height: 0; }
  .cap { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  .cap b { font: 400 18px/1.2 var(--display); text-transform: uppercase; }
  .cap span { color: var(--dim); }
  .empty { aspect-ratio: 1; border: 2px dashed color-mix(in srgb, var(--dim) 60%, transparent); display: grid; place-items: center;
           font: 400 48px var(--display); color: color-mix(in srgb, var(--dim) 45%, transparent); }
  .empty.next { border-color: var(--acc); color: var(--acc); }
  .empty.next::after { content: "next"; position: absolute; }
  .empty.next { position: relative; font-size: 0; }
  .empty.next::after { font: 700 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }

  dialog { width: min(920px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 3px solid var(--line);
           background: var(--bg); color: var(--fg); overscroll-behavior: contain; }
  dialog::backdrop { background: rgb(0 0 0 / .6); overflow: hidden; overscroll-behavior: contain; }
  /* Dialog enter/exit: fade in 200ms, out 150ms; the slight scale is skipped under reduced motion */
  dialog, dialog::backdrop { transition: opacity 200ms cubic-bezier(.23, 1, .32, 1), overlay 200ms allow-discrete, display 200ms allow-discrete; }
  dialog:not([open]), dialog:not([open])::backdrop { opacity: 0; transition-duration: 150ms; }
  @starting-style { dialog[open], dialog[open]::backdrop { opacity: 0; } }
  @media (prefers-reduced-motion: no-preference) {
    dialog { transition: opacity 200ms cubic-bezier(.23, 1, .32, 1), scale 200ms cubic-bezier(.23, 1, .32, 1), overlay 200ms allow-discrete, display 200ms allow-discrete; }
    dialog:not([open]) { scale: .96; }
    @starting-style { dialog[open] { scale: .96; } }
  }
  .dlg { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .big { display: grid; place-items: center; min-height: 360px; background: var(--tile); border-right: 3px solid var(--line); overflow: hidden; }
  .big > div { scale: 1.6; }
  .side { display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; padding: 20px; min-width: 0; }
  .side h2 { margin: 0; font: 400 44px/.95 var(--display); text-transform: uppercase; }
  .side h2 span { color: var(--acc); display: block; font: 700 12px var(--mono); letter-spacing: .1em; margin-bottom: 6px; }
  .side p { margin: 0; color: var(--dim); }
  pre { margin: 0; padding: 12px; overflow: auto; max-height: 280px; font: 12px/1.5 var(--mono); background: var(--tile); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; }
  .bar .close { margin-left: auto; }
  @media (max-width: 720px) { .dlg { grid-template-columns: 1fr; } .big { min-height: 240px; border-right: 0; border-bottom: 3px solid var(--line); } .big > div { scale: 1.3; } }

  /* Touch baseline: no tap flash, no double-tap delay, press feedback, no iOS input zoom */
  html { -webkit-tap-highlight-color: transparent; }
  button, a, .btn, summary { touch-action: manipulation; }
  button, .btn, summary { -webkit-user-select: none; user-select: none; }
  button, .btn { transition: transform 160ms cubic-bezier(.23, 1, .32, 1); }
  button:active, .btn:active { transform: scale(.97); }
  .tile:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  @media (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
    button, .btn { min-block-size: 44px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Creative Lab</a>
  <header>
    <h1>Loader<br>a day<span>.</span></h1>
    <div class="meta">
      <div class="count" id="count"></div>
      <button id="motion" type="button">Pause all</button>
    </div>
  </header>
  <p class="lede">Thirty days, one loading animation each. Pure HTML and CSS, so every one can be copied straight into a project. Click a loader to see it bigger and grab the code.</p>
  <ul class="grid" id="grid"></ul>
</main>

<dialog id="dlg" closedby="any" aria-labelledby="dlg-title">
  <div class="dlg">
    <div class="big" id="big"></div>
    <div class="side">
      <h2 id="dlg-title"></h2>
      <p id="dlg-note"></p>
      <pre id="dlg-code"></pre>
      <div class="bar">
        <button type="button" id="prev" aria-label="Previous loader">←</button>
        <button type="button" id="next" aria-label="Next loader">→</button>
        <button type="button" id="copy">Copy code</button>
        <button type="button" class="close" id="close">Close</button>
      </div>
    </div>
  </div>
</dialog>

<script src="loaders.js"></script>
<script>
  // Each loader renders in its own shadow root so its CSS can't leak into the page or into other loaders.
  // Off-screen tiles pause. Reduced-motion visitors get each loader's own slowed-down version (it lives in its CSS).
  // Forced colors (Windows High Contrast) would erase the loaders' fills, so they opt out and draw in system colors.
  const TOTAL = 30;
  const loaders = [...window.LOADERS].sort((a, b) => a.day - b.day);
  const pad = n => String(n).padStart(2, '0');
  const PAUSE_CSS = `:host { display: block; } :host([data-paused]) *, :host([data-paused]) *::before, :host([data-paused]) *::after { animation-play-state: paused !important; }
@media (forced-colors: active) { :host { --ink: CanvasText; --acc: Highlight; } *, *::before, *::after { forced-color-adjust: none; } }`;

  let motionOn = true;
  const hosts = new Set();

  function mount(el, l) {
    const root = el.attachShadow({ mode: 'open' });
    root.innerHTML = `<style>${PAUSE_CSS}\n${l.css}</style>${l.html}`;
    hosts.add(el);
    syncPause(el);
    return el;
  }
  function syncPause(el) { el.toggleAttribute('data-paused', !motionOn || el.dataset.offscreen === '1'); }

  const io = new IntersectionObserver(entries => {
    for (const e of entries) { e.target.dataset.offscreen = e.isIntersecting ? '' : '1'; syncPause(e.target); }
  }, { rootMargin: '100px' });

  // Grid: filled slots first, then dashed placeholders up to day 30
  const grid = document.getElementById('grid');
  const byDay = new Map(loaders.map(l => [l.day, l]));
  const lastDay = Math.max(0, ...loaders.map(l => l.day));
  for (let d = 1; d <= TOTAL; d++) {
    const li = document.createElement('li');
    const l = byDay.get(d);
    if (l) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile';
      b.setAttribute('aria-label', `Day ${pad(d)}: ${l.name}. Open details`);
      const stage = document.createElement('div'); stage.className = 'stage';
      const host = document.createElement('div');
      stage.append(host);
      b.innerHTML = '';
      b.append(stage);
      const cap = document.createElement('div'); cap.className = 'cap';
      cap.innerHTML = `<b></b><span>${pad(d)}</span>`;
      cap.querySelector('b').textContent = l.name;
      b.append(cap);
      b.addEventListener('click', () => open(loaders.indexOf(l)));
      li.append(b);
      mount(host, l);
      io.observe(host);
    } else {
      li.className = 'empty' + (d === lastDay + 1 ? ' next' : '');
      li.textContent = pad(d);
      li.setAttribute('aria-label', `Day ${pad(d)}: not made yet`);
    }
    grid.append(li);
  }
  document.getElementById('count').innerHTML = `${pad(loaders.length)}<small> / ${TOTAL} days</small>`;

  // Pause / play toggle
  const motionBtn = document.getElementById('motion');
  function setMotion(on) {
    motionOn = on;
    motionBtn.textContent = on ? 'Pause all' : 'Play all';
    hosts.forEach(syncPause);
  }
  motionBtn.addEventListener('click', () => setMotion(!motionOn));
  setMotion(motionOn);

  // Detail dialog
  const dlg = document.getElementById('dlg'), big = document.getElementById('big');
  let cur = 0, bigHost = null;
  const source = l => `${l.html}\n\n<style>\n${l.css}\n</style>`;
  function show(i) {
    cur = (i + loaders.length) % loaders.length;
    const l = loaders[cur];
    if (bigHost) hosts.delete(bigHost);
    bigHost = document.createElement('div');
    big.replaceChildren(bigHost);
    mount(bigHost, l);
    document.getElementById('dlg-title').innerHTML = `<span>Day ${pad(l.day)}</span>`;
    document.getElementById('dlg-title').append(l.name);
    document.getElementById('dlg-note').textContent = l.note;
    document.getElementById('dlg-code').textContent = source(l);
    document.getElementById('copy').textContent = 'Copy code';
  }
  function open(i) { show(i); dlg.showModal(); }
  document.getElementById('prev').onclick = () => show(cur - 1);
  document.getElementById('next').onclick = () => show(cur + 1);
  document.getElementById('close').onclick = () => dlg.close();
  let copyT;
  document.getElementById('copy').onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(source(loaders[cur])); b.textContent = 'Copied'; }
    catch { b.textContent = 'Copy failed'; }
    clearTimeout(copyT); copyT = setTimeout(() => (b.textContent = 'Copy code'), 2000);
  };
  dlg.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(cur + 1);
    if (e.key === 'ArrowLeft') show(cur - 1);
  });
  // Light dismiss for browsers without closedby (Safari)
  if (!('closedBy' in HTMLDialogElement.prototype)) {
    dlg.addEventListener('click', e => {
      if (e.target !== dlg) return;
      const r = dlg.getBoundingClientRect();
      const inside = r.top <= e.clientY && e.clientY <= r.bottom && r.left <= e.clientX && e.clientX <= r.right;
      if (!inside) dlg.close();
    });
  }
</script>
</body>
</html>
